<div class="mobile-header">

        <nav class="mobile-show">
            <ul  class="mobile-ul ">
                <a class="text-black-500 opacity-80 text-lg font-semibold" href="#">Collections</a>
                <a class="text-black-500 opacity-80 text-lg font-semibold" href="#">Men</a>
                <a class="text-black-500 opacity-80 text-lg font-semibold" href="#">Women</a>
                <a class="text-black-500 opacity-80 text-lg font-semibold" href="#">About</a>
                <a class="text-black-500 opacity-80 text-lg font-semibold" href="#">Contact</a>
                <img (click) = "toggleLinks()" class="w-8 h-8 md:w-10 md:h-10 absolute left-32 top-5" src="/images/icon-close.svg" alt="close">

        </nav>
